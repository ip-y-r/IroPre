name: IroPre
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  IroPre:
    type: application
    platform: iOS
    bundleId: com.example.iropre
    deploymentTarget: "18.0"
    sources:
      - path: IroPre
        excludes:
          - "**/*.md"
    resources:
      - path: IroPre/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iropre
        PRODUCT_NAME: IroPre
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: IroPre/Resources/Info.plist
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        # ポートレート固定
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
    info:
      path: IroPre/Resources/Info.plist
      properties:
        CFBundleName: IroPre
        CFBundleDisplayName: IroPre
        CFBundleIdentifier: com.example.iropre
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSMinimumSystemVersion: "18.0"
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
    dependencies: []
    scheme:
      testTargets:
        - IroPreTests

  IroPreTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.example.iropre.tests
    deploymentTarget: "18.0"
    sources:
      - path: IroPreTests
    dependencies:
      - target: IroPre
    settings:
      base:
        SWIFT_VERSION: "6.0"
